- name: copy eula and directory
  copy:
    src: Spigot
    dest: /usr/local/ec2-user/

- name: Download Spigot
  get_url:
    url: https://download.getbukkit.org/spigot/spigot-1.19.4.jar
    dest: /usr/local/ec2-user/Spigot/server.jar

- name: Start server
  command: /usr/local/ec2-user/server.jar 