- name: copy eula and directory
  copy:
    src: Spigot
    dest: /usr/local/ec2-user/

- name: Download Spigot
  get_url:
    url: https://download.getbukkit.org/spigot/spigot-1.20.1.jar
    dest: /usr/local/ec2-user/Spigot/server.jar
- name: fix permissions
  command: sudo chmod 777 /usr/local/ec2-user/Spigot/server.jar 
- name: Start server
  command: sudo java -Xms8G -Xmx8G -jar /usr/local/ec2-user/Spigot/server.jar 
  args:
    chdir: /usr/local/ec2-user/Spigot/