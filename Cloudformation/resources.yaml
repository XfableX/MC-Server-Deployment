AWSTemplateFormatVersion: '2010-09-09'

Description: Common resources

Parameters:
  AMI:
    Description: Not required
    Type: String
  Release:
    Description: The release to grab
    Type: String


Resources:
  MinecraftDrive:
    Type: AWS::EFS::FileSystem
    Properties: 
      BackupPolicy: 
        Status: "ENABLED"
      FileSystemTags: 
        - Key: Release
          Value: !Ref Release


